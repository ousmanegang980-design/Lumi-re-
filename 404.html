<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Lumière du Monde</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/icons/favicon.ico">
<style>
  :root{--navy:#0B2545;--navy-900:#071C36;--gold:#F7C333;--grey:#F6F8FB;--text:#12263F;--muted:#56677E}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:1rem;padding:2rem 1.25rem;text-align:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--grey);color:var(--text);line-height:1.6}
  .brand{display:flex;align-items:center;gap:.6rem;font-weight:800;color:var(--navy);font-size:1.05rem}
  .brand img{width:42px;height:42px}
  h1{font-size:clamp(1.6rem,5vw,2.3rem);color:var(--navy);margin:.4rem 0 0;line-height:1.2}
  p{margin:0;color:var(--muted);max-width:46ch}
  .code{font-weight:700;color:var(--gold);background:var(--navy);border-radius:999px;padding:.25rem .8rem;font-size:.8rem;letter-spacing:.1em}
  .actions{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.6rem}
  a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.8rem 1.3rem;border-radius:10px;
        font-weight:600;text-decoration:none;font-size:.95rem}
  .gold{background:var(--gold);color:var(--navy-900)}
  .out{background:#fff;color:var(--navy);border:1.5px solid #DCE6F2}
  footer{margin-top:1.5rem;font-size:.85rem;color:var(--muted)}
  footer a{color:var(--navy)}
</style>
</head>
<body>
  <p class="brand"><img src="/assets/img/logo-mark.svg" alt="" width="42" height="42">Lumière du Monde</p>
  <p class="code">ERREUR 404</p>
  <h1>Cette page n’existe pas (ou plus)</h1>
  <p>La page demandée est introuvable. Revenez à l’accueil pour retrouver nos services, nos produits et nos coordonnées.</p>
  <div class="actions">
    <a class="btn gold" href="/">Retour à l’accueil</a>
    <a class="btn out" href="tel:+22893328192">Appeler : +228 93 32 81 92</a>
  </div>
  <footer>Route de Sanguéra–Agoè, à environ 100 m du lycée de Sanguéra, Togo.</footer>
</body>
</html>
